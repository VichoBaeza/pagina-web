<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Casino 67aura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="diseñoDePágina.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0f172a;">
        <div class="container-fluid">
            <a class="navbar-brand text-danger fw-bold" href="index.html">Casino 67aura</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="ruleta.html">Mesa de Ruleta</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container casino-container">
        <header class="text-center mb-4">
            <h1>Formulario de Registro</h1>
        </header>
        
        <main class="d-flex justify-content-center">
            <div class="form-container w-100" style="max-width: 500px;">
                <form id="formRegistro" action="index.html" method="get">
                    <div class="mb-3">
                        <label for="nombre" class="form-label text-white">Nombre completo:</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label text-white">Correo electrónico:</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label text-white">Contraseña:</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <div class="mb-4">
                        <label for="password_confirm" class="form-label text-white">Confirmar contraseña:</label>
                        <input type="password" class="form-control" id="password_confirm" required>
                    </div>
                    
                    <div id="errorMsg" class="alert alert-danger d-none" role="alert">
                        Las contraseñas no coinciden. Por favor, verifícalas.
                    </div>
                    
                    <button type="submit" class="btn btn-casino w-100">Crear Cuenta</button>
                </form>
            </div>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="registro.js"></script>
</body>
</html>
