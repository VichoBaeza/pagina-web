<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Casino 67aura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="diseñoDePágina.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0f172a;">
        <div class="container-fluid">
            <a class="navbar-brand text-danger fw-bold" href="index.html">Casino 67aura</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="hub.html">Catálogo de Juegos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container casino-container" x-data="formRegistroComponent()">
        <header class="text-center mb-4">
            <h1>Formulario de Registro</h1>
        </header>
        
        <main class="d-flex justify-content-center">
            <div class="form-container w-100" style="max-width: 500px;">
                <!-- Formulario procesado por Alpine con @submit.prevent -->
                <form @submit.prevent="procesarRegistro">
                    <div class="mb-3">
                        <label for="nombre" class="form-label text-white">Nombre completo:</label>
                        <input type="text" class="form-control" id="nombre" x-model="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label text-white">Correo electrónico:</label>
                        <input type="email" class="form-control" id="email" x-model="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label text-white">Contraseña:</label>
                        <input type="password" class="form-control" id="password" x-model="password" required>
                    </div>
                    <div class="mb-4">
                        <label for="password_confirm" class="form-label text-white">Confirmar contraseña:</label>
                        <input type="password" class="form-control" id="password_confirm" x-model="passwordConfirm" required>
                    </div>
                    
                    <!-- Alerta de Error -->
                    <div x-show="mensajeError" class="alert alert-danger mb-3" role="alert" x-text="mensajeError"></div>

                    <!-- Alerta de Éxito con advertencia de sesión -->
                    <div x-show="exito" class="alert alert-success mb-3" role="alert">
                        <p class="mb-1 fw-bold">¡Registro exitoso! Bienvenido, <span x-text="nombre"></span>.</p>
                        <small class="d-block text-muted">(Simulación en memoria. Esta información se perderá al recargar la página).</small>
                    </div>
                    
                    <button type="submit" class="btn btn-casino w-100">Crear Cuenta</button>
                </form>
            </div>
        </main>
    </div>
    
    <script>
        function formRegistroComponent() {
            return {
                nombre: '',
                email: '',
                password: '',
                passwordConfirm: '',
                mensajeError: '',
                exito: false,

                procesarRegistro() {
                    this.mensajeError = '';
                    this.exito = false;

                    if (this.password !== this.passwordConfirm) {
                        this.mensajeError = 'Las contraseñas no coinciden. Por favor verifícalas.';
                        return;
                    }

                    if (this.password.length < 4) {
                        this.mensajeError = 'La contraseña debe tener al menos 4 caracteres.';
                        return;
                    }

                    this.exito = true;
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
