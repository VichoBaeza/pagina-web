<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Casino 67aura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="diseñoDePágina.css">
    
    <script defer src="/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0f172a;">
        <div class="container-fluid">
            <a class="navbar-brand text-danger fw-bold" href="index.html">Casino 67aura</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="hub.html">Catálogo de Juegos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container casino-container" x-data="cuenta('login')">
        <header class="text-center mb-4">
            <h1>Iniciar Sesión</h1>
        </header>
        
        <main class="d-flex justify-content-center">
            <div class="form-container w-100" style="max-width: 500px;">
                <form @submit.prevent="enviar()">
                    <div class="mb-3">
                        <label for="usuario" class="form-label text-white">Nombre de Usuario:</label>
                        <input type="text" class="form-control" id="usuario" x-model="usuario" required autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <label for="clave" class="form-label text-white">Contraseña:</label>
                        <input type="password" class="form-control" id="clave" x-model="clave" required autocomplete="current-password">
                    </div>
                    
                    <div x-show="mensaje" class="alert mb-3" :class="error ? 'alert-danger' : 'alert-success'" role="alert" x-text="mensaje"></div>
                    
                    <button type="submit" class="btn btn-casino w-100" :disabled="enviando" x-text="enviando ? 'Validando...' : 'Ingresar'"></button>
                </form>
            </div>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
